    <nav class="navbar navbar-expand-lg fixed-top  navbar-dark bg-dark" aria-label="Main navigation">
        <div class="container">
            <h2 class="navbar-brand text-warning"><svg class="bi me-2" style="fill: #ffc107 ;" width="2rem" height="2rem" ><use xlink:href="#logo"/></svg>StudyHive</h2>
          <button class="navbar-toggler p-0 border-0" type="button" id="navbarSideCollapse" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
      
          <div class="navbar-collapse offcanvas-collapse" id="navbarsExampleDefault">
            <ul class="navbar-nav me-auto mb-1 mt-2 mb-lg-0">
              <li class="nav-item ">
                <a class="nav-link"  aria-current="page" href="{% url "index" %}">Home</a>
              </li>
            </ul> 
          
            {% if user.is_authenticated  %}
            <div class="nav-item dropdown">
                <button class="btn btn-warning dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                  <svg class="bi me-2  theme-icon" width="1em" height="1em"><use xlink:href="#profile"/></svg>
                </button>
                <ul class="dropdown-menu text-small">
                  <li class="ms-2 mb-0" style="color: rgb(255, 77, 0);"><i><h6>Hey</h6></i></li>
                  <li class="ms-2 mb-0" style="color: rgb(41, 41, 41);">{{user.username}}</li>
                  <li><hr class="dropdown-divider ms-1 me-1 mb-0"></li>
                  <li><a class="dropdown-item" href="/mycourses/"><svg class="bi me-2  theme-icon" width="1em" height="1em"><use xlink:href="#book"/></svg>My Courses</a></li>
                  <li><a class="dropdown-item " href="/myprofile/"><svg class="bi me-2  theme-icon" width="1em" height="1em"><use xlink:href="#profile"/></svg>My Profile</a></li>
                  <li><a class="dropdown-item active" href="#"><svg class="bi me-2  theme-icon" width="1em" height="1em"><use xlink:href="#help"/></svg>Help</a></li>
                  <li><a class="dropdown-item" href="/userlogout/"><svg class="bi me-2  theme-icon" width="1em" height="1em"><use xlink:href="#logout"/></svg>Sign out</a></li>
                </ul>
              </div>
            {% endif %}

          </div>
        </div>
      </nav>
<main>

  {% if user.is_authenticated  %}
    <div class=" container p-2 mt-3 mb-3">
        <h2 class="h2 border-bottom p-2 mb-4 mt-2">Support Team</h2>
        <form action="/userhelp/" method="post">
          {% csrf_token %}
        <div class=" container p-1 ">
            <div class="row mb-2 p-2">
                <div class="col-sm p-1">
                   <label for="Name" class=" form-label">Name</label>
                   <input type="text" class=" form-control" name="Name" value="{{user.username}}"  disabled>
                </div>

                <div class="col-sm p-1">
                  <label for="Querytype">What type of support do you need?</label>
                  <select id="support-query" name="Querytype" required>
                     <option value="" selected disabled>-- Select --</option>
                      <option value="account-issues">Account Issues</option>
                      <option value="technical-support">Technical Support</option>
                      <option value="course-enrollment">Course Enrollment</option>
                      <option value="payment-issues">Payment Issues</option>
                      <option value="content-access">Content Access Problems</option>
                      <option value="certificate-issues">Certificate Issues</option>
                      <option value="general-inquiries">General Inquiries</option>
                      <option value="feedback-suggestions">Feedback or Suggestions</option>
                      <option value="other">Other</option>
                  </select>
              </div>

              <div class="col-sm p-1 ">
                <label for="UserEmail" class=" form-label">Email</label>
               <input type="email" class=" form-control" name="UserEmail"  required>
            </div>
          </div>
      
            <div class="row mb-2 p-2">
                <div class="col-sm p-1 ">
                    <label for="UserQuery" class=" form-label">Describe Your Query</label>
                    <textarea name="UserQuery" class=" form-control" required></textarea>
                </div>
            </div>

            <div class="row mb-2 p-2">
                <div class="col-sm p-1 ">
                    <button type="submit" class="btn btn-primary">Submit</button>
                 </div>
                <div class="col-sm p-1 ">
                   <input type="hidden" class="form-control" value="{{user.username}}" name="Username">
                </div>
            </div>
        </div>
      </form>
    </div>
    {% endif %}

<!--Section Footer-->
<div class="container-fluid " >
    <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top " >
      <p class="col-md-4 mb-0 text-body-secondary">&copy; 2024 Company, Inc</p>
  
      <a href="#" class="col-md-4 d-flex align-items-center justify-content-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
        <svg class="bi me-2" width="40" height="32"><use xlink:href="#logo"/></svg>StudyHive
      </a>
  
      <ul class="nav col-md-4 justify-content-end">
        <li class="ms-3"><a class="text-body-secondary" href="#"><svg class="bi" width="24" height="24"><use xlink:href="#github"/></svg></a></li>
        <li class="ms-3"><a class="text-body-secondary" href="#"><svg class="bi" width="24" height="24"><use xlink:href="#linkedin"/></svg></a></li>
      </ul>
    </footer>
  </div>
</main>

{% load static %}
<script src="{% static 'Scripts\offcanvas-navbar.js' %}"></script>   
</body>
</html>
